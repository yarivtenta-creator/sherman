name: Build JARIFILTER Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows-vst3:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure JUCE project
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build JARIFILTER
        run: cmake --build build --config Release --parallel

      - name: Smoke-test editor startup
        shell: pwsh
        run: |
          $exe = "build/JARIFILTER_artefacts/Release/Standalone/JARIFILTER.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "JARIFILTER exited during startup with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force

      - name: Upload JARIFILTER VST3
        uses: actions/upload-artifact@v4
        with:
          name: JARIFILTER-Windows-VST3
          path: build/JARIFILTER_artefacts/Release/VST3/JARIFILTER.vst3
          if-no-files-found: error
          retention-days: 30
